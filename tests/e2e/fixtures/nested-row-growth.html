     nested table that grows has to push its host cell and the outer table with
     it. Loaded via /demo/ui-harness.html?fixture=nested-row-growth -->

  id="outer-table"
  class="bloom-table"
  data-column-widths="240px,200px"
  data-row-heights="hug"

      </div>

  <div class="bloom-cell" data-content-type="text">
    <div contenteditable="true">Outer 2</div>

</div>
